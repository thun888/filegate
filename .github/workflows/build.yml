name: Build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            goos: windows
            goarch: amd64
            ext: .exe
            artifact_name: filegate-windows-amd64
          - os: windows-latest
            goos: windows
            goarch: arm64
            ext: .exe
            artifact_name: filegate-windows-arm64
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            ext: ""
            artifact_name: filegate-linux-amd64
          - os: ubuntu-latest
            goos: linux
            goarch: arm64
            ext: ""
            artifact_name: filegate-linux-arm64
          - os: macos-latest
            goos: darwin
            goarch: amd64
            ext: ""
            artifact_name: filegate-macos-amd64
          - os: macos-latest
            goos: darwin
            goarch: arm64
            ext: ""
            artifact_name: filegate-macos-arm64

    runs-on: ${{ matrix.os }}
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: Cache Go build cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/go-build
          key: ${{ runner.os }}-go-build-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-build-

      - name: Set version
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "VERSION=${{ github.ref_name }}" >> $GITHUB_ENV
          else
            echo "VERSION=dev" >> $GITHUB_ENV
          fi
        shell: bash

      - name: Build
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -ldflags="-s -w -X github.com/thun888/filegate/internal/server.Version=${{ env.VERSION }}" -o dist/filegate-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }} ./cmd/server/

      # - name: Install UPX (Windows)
      #   if: matrix.goos == 'windows' && matrix.goarch == 'amd64'
      #   run: choco install upx --no-progress

      # - name: Install UPX (Linux)
      #   if: matrix.goos == 'linux'
      #   run: sudo apt-get update && sudo apt-get install -y upx-ucl

      # - name: Compress with UPX
      #   if: (matrix.goos == 'windows' && matrix.goarch == 'amd64') || matrix.goos == 'linux'
      #   run: upx --best --lzma dist/filegate-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/filegate-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true

