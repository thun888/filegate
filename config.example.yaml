backends:
  - name: "backend1"
    type: "http" # fs, s3, http
    # 接口 + registry 加载
    config:
      # http 专用
      url_prefix: "http://localhost:8080"
      extra_headers:
        X-Example-Header: "example-value"

      # s3 专用，bucket默认使用路径方式访问
      endpoint: "s3.amazonaws.com"
      region: "us-east-1"
      bucket: "my-bucket"
      access_key: ""
      secret_key: ""

      # fs 专用
      root_path: "/data/backups"

    # 公共配置
    timeout: 5s
    retries: 3
    retry_delay: 1s
    circuit_breaker:
      failure_threshold: 5
      recovery_timeout: 30s
      half_open_timeout: 10s

backend_policy:
  - name: "policy1"
    strategy: fallback # single | fallback | round_robin | random | priority
    backends:
      - backend1
      - backend2

# 对应路径：http://localhost:8080/fs/{namespace}/{class}/{path}.jpg@!{rule}_{width}w_{height}h_{blur}b_{quality}q.{format}
# 规则选择：路径后缀段 !{rule}（如 @!png_conversion_320w）或查询参数 rule={rule}（如 ?rule=png_conversion）。
# 两者同时给出且不一致时报 400；均未给出时不做转换，按原始路径直接回源。
# 转换后缀按段解析（!{rule}=规则选择器, <数字>w=宽度, <数字>h=高度, <数字>b=模糊(sigma×10), <数字>q=质量, .<扩展名>=输出格式）：
# 顺序无关、可部分省略（如 @!png_conversion_600h、@!png_conversion_70q.webp），宽度/高度为 0 表示保持原尺寸；
# 未在 enable_request_params 中启用的字段会被静默忽略（查询参数与路径后缀同策略）。
# blur 为高斯模糊 sigma×10 的整数（如 5b 表示 0.5，15b 表示 1.5），0b 或省略表示不模糊
namespaces:
  - name: "namespace1"
    backend_policy: "policy1"
    class:
      - name: "class1"
        security:
          # 来源头检查
          refer_check:
            enabled: true
            allowed_referers:
              - "http://example.com"
              - "http://another.com"
          signature:
            enabled: true
            secret: "xxxx"
            # sign = HMAC_SHA256(canonical_string + exp + secret) => ?exp=1710000000&sign=xxx
            # canonical_string =
            # METHOD
            # PATH
            # QUERY
            # EXPIRE
            # exp: 过期时间，单位秒
            expire: 300
          path_filter:
            deny_patterns:
              - "../"
              - ".git"
            allow_paths:
              - images/
              - avatars/
            allow_extensions:
              - jpg
              - jpeg
              - png
              - webp
        # 文件处理
        file_conversion:
          - rule: "png_conversion"
            enable_request_params:
              width:
                enabled: true
                min: 1
                max: 8192
              height:
                enabled: true
                min: 1
                max: 8192
              quality:
                enabled: true
                min: 10
                max: 95
              blur: true
              format: true
        # 响应头设置
        response_headers:
          Cache-Control: "public,max-age=3600"
          Access-Control-Allow-Origin: "*"

file_conversion_rules:
  - name: "png_conversion"
    max_file_size: "100MB"
    default_params:
      width: 800
      height: 600
      blur: 0.5
      quality: 80
      format: "avif"
    watermark:
      # 需要在 imgproxy 端配置水印图片
      enabled: true
      opacity: 0.5
      position: "soea"  # ce(居中), no(顶部), so(底部), ea(右边), we(左边), noea(右上), nowe(左上), soea(右下), sowe(左下), re(平铺), ch(棋盘格)
      x_offset: 0  # X轴偏移量，>=1或<=-1为绝对像素值，(-1,1)为相对值
      y_offset: 0  # Y轴偏移量，>=1或<=-1为绝对像素值，(-1,1)为相对值
      scale: 0     # 水印大小相对于结果图片的比例，0表示不改变大小
      
service:
  imgproxy:
    url: ''
    timeout: 20s
    signature:
      enabled: false
      key: ''
      salt: ''

system:
  server:
    base_url: "http://127.0.0.1:8080"
    host: 127.0.0.1
    port: 8080
    
  logging:
    level: info
    access_log: true

  metrics:
    prometheus: true
    labels:
      service: filegate